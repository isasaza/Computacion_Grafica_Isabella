<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model GLB</title>

    <style>
      html, body {
        margin: 0;
        overflow: hidden;  
      }

      .flecha {
        position: fixed;
        top: 50%;
        transform: translateY(-50%);
        width: 64px;
        height: 64px;
        font-size: 28px;
        border: none;
        border-radius: 50%;
        background: #000000;
        color: white;
        cursor: pointer;
        z-index: 10;
        transition: background 0.2s, transform 0.2s;
      }
      
      
      #flechaIzq { left: 30%; }    
      #flechaDer { right: 30%; }   
      #titulo {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        color: white;
        font-family: sans-serif;
        z-index: 10;
      }
      
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
        }
    }
    </script>
</head>
<body>
   <button id="flechaIzq" class="flecha"> ← </button>
   <button id="flechaDer" class="flecha"> → </button>

   <div id="titulo">
     <h2>Elige tu BMO</h2>
   </div>

   <script type="module" src="../js/main.js"></script>
</body>
</html>
